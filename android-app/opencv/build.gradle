// OpenCV Android SDK 模块构建文件
// 使用方法: 将 OpenCV-android-sdk/sdk/ 内容复制到此目录,
// 或替换为以下 AAR 引用方式

apply plugin: 'com.android.library'

android {
    namespace 'org.opencv'
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 如使用官方 SDK, 复制 sdk/java/ 和 sdk/native/ 到此
    sourceSets {
        main {
            java.srcDirs = ['java']
            jniLibs.srcDirs = ['native/libs']
            manifest.srcFile 'AndroidManifest.xml'
            res.srcDirs = ['res']
        }
    }
}

dependencies {
    // OpenCV 核心已通过 native libs 提供
}
