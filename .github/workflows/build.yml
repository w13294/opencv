name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: android-app

      - name: Decode Keystore (release only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android-app/app/release-key.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: ./gradlew assembleDebug --no-daemon --stacktrace > gradle_build_log.txt 2>&1
        working-directory: android-app

      - name: Post build error as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd android-app
          ERR=$(grep -E "e: |error:|FAILURE|What went wrong|BUILD FAILED|Execution failed|> Task|w: " gradle_build_log.txt | head -60)
          if [ -z "$ERR" ]; then ERR=$(tail -50 gradle_build_log.txt); fi
          printf '## 构建失败日志 (%s)\n```\n%s\n```\n' "$(date -u)" "$ERR" > comment_body.txt
          python3 - <<'PY'
          import json, urllib.request, os
          token = os.environ['GH_TOKEN']
          repo = '${{ github.repository }}'
          sha = '${{ github.sha }}'
          body = open('comment_body.txt').read()
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/commits/{sha}/comments',
              data=json.dumps({'body': body}).encode(),
              headers={'Authorization': f'Bearer {token}',
                       'Accept': 'application/vnd.github+json',
                       'X-GitHub-Api-Version': '2022-11-28'},
              method='POST')
          try:
              with urllib.request.urlopen(req) as r:
                  print('comment posted:', r.status)
          except Exception as e:
              print('comment failed:', e)
          PY

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android-app/gradle_build_log.txt

      - name: Fail if build failed
        if: failure()
        run: exit 1

      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=$PWD/app/release-key.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
        working-directory: android-app

      - name: Upload Debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-app/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android-app/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/app/build/outputs/apk/release/*.apk
